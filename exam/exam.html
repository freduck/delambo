<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Application</title>
    <style>
*{
    padding: 0;
    margin: 0;
}
body {
            font-family: Arial, sans-serif;
            
        }
        h1{
            text-align: center;
        }
        .question {
            margin-bottom: 20px;
        }
        .options {
            margin-left: 20px;
        }
        .options label {
            display: block;
            margin-bottom: 5px;
        }
        #submit-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 400px;
            margin-bottom: 40px;
        }
        #submit-btn:hover {
            background-color: #0056b3;
        }
        #result {
            position: relative;
            margin: 0 auto;
            width: 400px;
            margin-top: 20px;
            font-size: 18px;

            font-weight: bold;
            display: none;
            animation: drop .3s ease-in;
            padding: 20px;
            font-size: 30px;
        }
        #quiz-container{
            width: 600px;
            border: 1px solid whitesmoke;
            margin: 0 auto;
            padding: 50px;
        }.top{
            background-color: crimson;
            color: white;
            padding: 60px;
            margin:0 0 20px 0;
        }
    </style>
</head>
<body>
    <div class="top">

        <h1>DE-LAMBO COLLEGE Computer-Based Exam  (CBE)</h1>
    </div>
    <div id="result"></div>
    <div id="quiz-container"></div>
    

<div id="timer"></div>


    <button id="submit-btn">Submit</button>
<script src="js/jquery.min.js"></script>
    <script>
        $.ajax({
          url:'get_exam.php',
          type:'POST',
          data:'subject='+$('#subject').val(),
          error:function(err){
            console.log(err);
          },
          success:function(response){
            const questions=JSON.parse(response);
const quizContainer = document.getElementById('quiz-container');
        questions.forEach((q, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.classList.add('question');
            questionDiv.innerHTML = `
            
                <p><strong>Q${index + 1}: ${q.question}</strong></p>
                <div class="options">
                    ${q.options.map(option => `
                        <label>
                            <input type="radio" name="question${index}" value="${option}">
                            ${option}
                        </label>
                    `).join('')}
                    
                    <hr style='margin-top:30px;'><br/>
                </div>
            `;
            quizContainer.appendChild(questionDiv);
        });

        // Handle form submission
       

          }
        });
        // Load questions into the quiz container
         document.getElementById('submit-btn').addEventListener('click', () => {
            let score = 0;

            // Check answers
            questions.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="question${index}"]:checked`);
                if (selectedOption && selectedOption.value === q.answer) {
                    score++;
                    const users={};
                    users.newKey=selectedOption;
                    users.newKey
                }
            });

            // Display result
            const resultDiv = document.getElementById('result');
            resultDiv.style.display='block';
            resultDiv.textContent = `You scored ${score} out of ${questions.length}`;
            resultDiv.scrollIntoView({
                behavior:'smooth',block:"center"
            })
        });
       


    </script>
</body>
</html>
